<!DOCTYPE html>
<html lang="nb" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>@title</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@digdir/designsystemet-css@1.21.0/index.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@digdir/designsystemet-css@1.21.0/theme.css" />
    <style>
        html,
        body {
            margin: 0;
            min-height: 100%;
            font-family: var(--ds-font-family, Arial, sans-serif);
            background: var(--ds-color-surface-default, #f3f4f6);
            color: var(--ds-color-text-default, #111827);
        }

        .receipt-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            box-sizing: border-box;
        }

        .receipt-card {
            width: 100%;
            max-width: 42rem;
            background: var(--ds-color-surface-default, #ffffff);
            border: 1px solid var(--ds-color-border-subtle, #d1d5db);
            border-radius: 0.75rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            padding: 2rem;
            box-sizing: border-box;
        }

        .receipt-header {
            margin-bottom: 1rem;
        }

        .receipt-title {
            margin: 0;
            font-size: 1.75rem;
            line-height: 1.2;
        }

        .receipt-subtitle {
            margin: 0.5rem 0 0;
            color: var(--ds-color-text-subtle, #4b5563);
        }

        .receipt-message {
            margin: 1.5rem 0;
            font-size: 1.05rem;
            line-height: 1.6;
        }

        .receipt-actions {
            margin-top: 1.5rem;
        }

        .receipt-button {
            display: inline-block;
            padding: 0.75rem 1.25rem;
            border-radius: 0.5rem;
            text-decoration: none;
            border: 1px solid var(--ds-color-border-default, #1f2937);
            background: var(--ds-color-surface-tinted, #f9fafb);
            color: var(--ds-color-text-default, #111827);
            font-weight: 600;
        }

        .receipt-button:hover {
            background: var(--ds-color-surface-hover, #f3f4f6);
        }
    </style>
</head>
<body data-color-scheme="light" data-size="md">
    <main class="receipt-page">
        <article class="receipt-card" aria-live="polite">
            <header class="receipt-header">
                <h1 class="receipt-title">@title</h1>
                <p class="receipt-subtitle">@servicecontext</p>
            </header>

            <p class="receipt-message">@message</p>

            <div class="receipt-actions">
                <a href="@altinnurl" class="receipt-button">@altinnmessage</a>
            </div>
        </article>
    </main>
</body>
</html>
