<!DOCTYPE html>
<html lang="@lang" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>@title</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@digdir/designsystemet-css@1.21.0/dist/src/base.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@digdir/designsystemet-css@1.21.0/dist/src/tag.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@digdir/designsystemet-css@1.21.0/dist/theme/designsystemet.css" />
    <style>
        html,
        body[data-color-scheme] {
            margin: 0;
            min-height: 100%;
            font-family: var(--ds-font-family, Arial, sans-serif);
            background: var(--ds-color-background-default, #f3f4f6);
            color: var(--ds-color-text-default, #111827);
        }

        .receipt-shell {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .receipt-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.75rem;
            padding: 1.25rem 2rem;
            background: var(--ds-color-surface-default, #ffffff);
            border-bottom: 1px solid var(--ds-color-border-subtle, #d1d5db);
            box-sizing: border-box;
        }

        .receipt-logo {
            display: inline-flex;
            min-width: 0;
            color: var(--ds-color-accent-base-default, #0062ba);
        }

        .receipt-logo svg {
            display: block;
            width: 15rem;
            max-width: 100%;
            height: auto;
        }

        /* .ds-tag ships width: max-content + flex-shrink: 0, so a long service
           context name cannot shrink or wrap. Let it cap at the topbar width;
           .ds-tag already sets word-break: break-word. */
        .receipt-topbar .ds-tag {
            max-width: 100%;
            flex-shrink: 1;
        }

        .receipt-page {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            box-sizing: border-box;
        }

        .receipt-card {
            width: 100%;
            max-width: 52rem;
            background: var(--ds-color-surface-default, #ffffff);
            border: 1px solid var(--ds-color-border-default, #2a7cc5);
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            padding: 3rem;
            /* org names come from Enhetsregisteret and can contain very long tokens;
               overflow-wrap is inherited, so this covers title, message and footer */
            overflow-wrap: break-word;
            box-sizing: border-box;
        }

        .receipt-header {
            margin-bottom: 1.25rem;
        }

        .receipt-title {
            margin: 0;
            font-size: 2.25rem;
            line-height: 1.2;
        }

        .receipt-message {
            margin: 1.75rem 0;
            font-size: 1.15rem;
            line-height: 1.65;
        }

        .receipt-message br {
            display: block;
            content: "";
            margin-top: 0.75rem;
        }

        .receipt-actions {
            margin-top: 2rem;
        }

        .receipt-button {
            display: inline-block;
            padding: 0.875rem 1.5rem;
            font-size: 1.05rem;
            border-radius: 0.5rem;
            text-decoration: none;
            border: 1px solid var(--ds-color-border-default, #1f2937);
            background: var(--ds-color-surface-tinted, #f9fafb);
            color: var(--ds-color-text-default, #111827);
            font-weight: 600;
        }

        .receipt-button:hover {
            background: var(--ds-color-surface-hover, #f3f4f6);
        }

        .receipt-footer {
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px solid var(--ds-color-border-subtle, #d1d5db);
            font-size: 0.9375rem;
            line-height: 1.5;
            color: var(--ds-color-text-subtle, #4b5563);
        }
        @media (max-width: 40rem) {
            .receipt-logo svg {
                width: 12rem;
            }

            .receipt-page {
                padding: 1rem;
            }

            .receipt-card {
                padding: 1.75rem;
            }

            .receipt-title {
                font-size: 1.75rem;
            }
        }

        @media (min-width: 1600px) {
            .receipt-card {
                max-width: 60rem;
                padding: 3.5rem;
            }

            .receipt-title {
                font-size: 2.5rem;
            }

            .receipt-message {
                font-size: 1.2rem;
            }
        }

    </style>
</head>

        </header>

        <main class="receipt-page">
            <article class="receipt-card">
                <header class="receipt-header">
                    <h1 class="receipt-title">@title</h1>
                </header>

                <p class="receipt-message">@message</p>

                <div class="receipt-actions">
                    <a href="@altinnurl" class="receipt-button">@altinnmessage</a>
                </div>

                <footer class="receipt-footer">
                    @ebevisInfo
                </footer>
            </article>
        </main>
    </div>
